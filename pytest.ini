[pytest]
pythonpath = .
testpaths = backend/tests
markers =
    prereqai: the PreReqAI product tests (the release checks); run with `pytest -m prereqai`
    browser: browser-level tests of the web page (need Playwright and Chromium; see requirements-browser.txt); run with `pytest -m browser`
    tesseract: OCR tests that run the real Tesseract engine (need the tesseract binary and English data; skipped without them, and failed instead of skipped when PREREQAI_REQUIRE_TESSERACT=1, as in the CI `ocr` job); run with `pytest -m tesseract`
