<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PreReqAI</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#5f5f5a; --card:#fff; --line:#d9d9d3; --accent:#1f5fbf; --bad:#a3231f; --ok:#1c6b3a; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#a3a39c; --card:#20201f; --line:#3a3a37; --accent:#7aa7f0; --bad:#ff8d86; --ok:#6fcf97; --warn:#e8b45a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.5rem; margin: .5rem 0 0; } h2 { font-size: 1.15rem; margin: 0 0 .5rem; }
  p.lead { color: var(--muted); margin-top: .25rem; }
  section, form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  label { display:block; font-weight:600; margin: .75rem 0 .25rem; } small { color: var(--muted); font-weight: 400; }
  input[type=text], input[type=file] { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { padding: .75rem 1rem; border-radius: 6px; border: 1px solid var(--line); margin: 1rem 0; }
  .msg.error { border-color: var(--bad); color: var(--bad); } .msg.warn { border-color: var(--warn); color: var(--warn); } .msg.info { color: var(--muted); }
  .table-wrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .gap { color: var(--bad); font-weight: 600; } .covered { color: var(--ok); font-weight: 600; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; } dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  button.small { margin: 0; padding: .2rem .6rem; font-size: .9rem; font-weight: 500; }
  input[type=checkbox] { width: 1.2rem; height: 1.2rem; }
  .actions { margin-top: .5rem; } .known-list { margin-top: .75rem; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { main { padding: .5rem; } dl { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>PreReqAI</h1>
  <p class="lead">Find out what to study before reading a research paper.</p>

  <form id="form" novalidate>
    <label for="paper">Paper PDF <small>(text-based PDF; scans are not read)</small></label>
    <input id="paper" name="paper" type="file" accept="application/pdf,.pdf">
    <label for="source">or an arXiv link / DOI <small>(for example arXiv:1706.03762 or 10.1145/3292500.3330701)</small></label>
    <input id="source" name="source" type="text" autocomplete="off" placeholder="https://arxiv.org/abs/1706.03762">
    <label for="known">Concepts you already know <small>(optional, comma separated, e.g. Linear Algebra, Probability)</small></label>
    <input id="known" name="known" type="text" autocomplete="off">
    <button id="submit" type="submit">Analyse paper</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="results" hidden>
    <section><h2>Paper</h2><dl id="meta"></dl></section>
    <section><h2>Detected concepts</h2><div id="concepts"></div></section>
    <section id="notanalysed" hidden><h2>Terms not analysed</h2><div id="notanalysedbody"></div></section>
    <section><h2>Prerequisite gaps</h2><div id="gaps"></div></section>
    <section><h2>Study plan</h2><div id="plan"></div><div class="actions"><button id="download" type="button" class="small" hidden>Download study plan (Markdown)</button></div></section>
  </div>
</main>
<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

function el(tag, text, className) {
  var node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (className) node.className = className;
  return node;
}

function safeUrl(url) { return /^https?:\/\//i.test(String(url)) ? url : null; }

function showStatus(kind, text, extra) {
  var box = $("status");
  box.textContent = "";
  if (!text) return;
  var node = el("div", text, "msg " + kind);
  if (extra) node.appendChild(el("div", extra));
  box.appendChild(node);
}

function table(headers, rows) {
  var wrap = el("div", null, "table-wrap"), t = el("table"), head = el("tr");
  headers.forEach(function (h) { head.appendChild(el("th", h)); });
  t.appendChild(head);
  rows.forEach(function (cells) {
    var tr = el("tr");
    cells.forEach(function (cell) {
      var td = el("td");
      if (cell && cell.nodeType) td.appendChild(cell); else td.textContent = cell === undefined || cell === null ? "" : String(cell);
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}

function fill(id, node) { var box = $(id); box.textContent = ""; box.appendChild(node); }

var KEY = "prereqai.session";  // the browser remembers only the session id; the server holds the progress
var state = { sid: null, paper: {}, difficulty: null, studyTime: null, readiness: null, steps: [], studied: {}, links: {}, known: [], busy: false };

function remember(sid) { try { if (sid) localStorage.setItem(KEY, sid); else localStorage.removeItem(KEY); } catch (e) { /* storage unavailable: no restore */ } }
function recall() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function sessionUrl(tail) { return "/api/prerequisites/sessions/" + encodeURIComponent(state.sid) + tail + "?concept="; }

function renderMeta() {
  var meta = $("meta"), paper = state.paper || {};
  meta.textContent = "";
  var facts = [["Title", paper.title]];
  if (paper.author !== undefined) facts.push(["Author", paper.author], ["Pages", paper.pages]);
  if (state.difficulty) facts.push(["Difficulty", state.difficulty.level + " - " + state.difficulty.explanation]);
  if (state.studyTime) facts.push(["Preparation", state.studyTime.total_hours + " h over about " + state.studyTime.recommended_days + " days"]);
  if (state.readiness) facts.push(["Readiness", state.readiness.status + " (" + state.readiness.progress_percent + "%)"]);
  facts.forEach(function (f) { meta.appendChild(el("dt", f[0])); meta.appendChild(el("dd", f[1])); });
}

function renderPlan() {
  var box = el("div");
  if (!state.steps.length) box.appendChild(el("p", "Nothing left to study: no planned prerequisites.", "msg info"));
  else box.appendChild(table(["Studied", "#", "Study", "Hours", "Resource", ""], state.steps.map(function (s) {
    var tick = el("input"), r = state.links[s.concept], cell = "", known = el("button", "I already know this", "small");
    tick.type = "checkbox"; tick.checked = !!state.studied[s.concept]; tick.disabled = state.busy;
    tick.setAttribute("aria-label", "Studied " + s.concept);
    tick.addEventListener("change", function () { setStudied(s.concept, tick.checked); });
    known.type = "button"; known.disabled = state.busy;
    known.addEventListener("click", function () { setKnown(s.concept, true); });
    if (r && safeUrl(r.url)) { cell = el("a", r.title); cell.href = r.url; cell.rel = "noopener noreferrer"; cell.target = "_blank"; }
    return [tick, s.step, s.concept, s.hours, cell, known];
  })));
  if (state.known.length) {
    var list = el("div", "Marked as known: ", "known-list");
    state.known.forEach(function (name) {
      var undo = el("button", "Undo " + name, "small");
      undo.type = "button"; undo.disabled = state.busy;
      undo.addEventListener("click", function () { setKnown(name, false); });
      list.appendChild(undo); list.appendChild(document.createTextNode(" "));
    });
    box.appendChild(list);
  }
  fill("plan", box);
  $("download").hidden = !state.sid; $("download").disabled = state.busy;
}

function render(body) {
  var report = body.report || {}, paper = report.paper || {};
  state.sid = body.session_id || state.sid; remember(state.sid);
  state.paper = paper; state.difficulty = report.paper_difficulty || null;
  state.studyTime = report.study_time || null; state.readiness = report.readiness || null;
  state.studied = {}; (report.study_progress || []).forEach(function (p) { if (p.completed) state.studied[p.concept] = true; });
  state.steps = (report.learning_plan || []).map(function (s) { return { step: s.step, concept: s.concept, hours: s.estimated_hours }; });
  state.links = {}; (report.learning_resources || []).forEach(function (r) { state.links[r.concept] = r; });
  state.known = (report.missing_prerequisites || []).filter(function (p) { return p.status === "known"; }).map(function (p) { return p.concept; });
  renderMeta();

  var evidence = report.concept_evidence || [];
  fill("concepts", evidence.length
    ? table(["Concept", "Area", "Mentions"], evidence.map(function (c) {
        return [c.concept, c.domain, c.occurrences + (c.mentioned_once ? " (mentioned once)" : "")];
      }))
    : el("p", "No known concepts were detected in this paper, so there is nothing to plan.", "msg warn"));

  var terms = report.not_analysed_terms || [];
  $("notanalysed").hidden = !terms.length;
  fill("notanalysedbody", terms.length ? el("div", null) : el("p", ""));
  if (terms.length) {
    var more = (report.not_analysed_total || terms.length) - terms.length;
    $("notanalysedbody").appendChild(el("p", report.not_analysed_note, "msg warn"));
    $("notanalysedbody").appendChild(el("p", terms.join("; ") + (more > 0 ? " and " + more + " more" : "")));
  }

  var prerequisites = report.missing_prerequisites || [];
  fill("gaps", prerequisites.length
    ? table(["Prerequisite", "Importance", "Status", "Why"], prerequisites.map(function (p) {
        return [p.concept, p.importance === "essential" ? "Essential" : p.importance === "supporting" ? "Supporting" : "-",
                el("span", p.satisfied ? "Covered or known" : "Gap", p.satisfied ? "covered" : "gap"), p.reason];
      }))
    : el("p", "This paper has no prerequisites to check.", "msg info"));

  renderPlan();
  $("results").hidden = false;
  var warnings = body.warnings || [];
  if (warnings.length) showStatus("warn", "Notes about this analysis:", warnings.join(" "));
  else showStatus("info", "");
}

// One request at a time: while one is running every control is disabled, and a second call is ignored. A failed request leaves the
// state as it was, and the re-render puts a ticked box back.
async function act(label, request, onOk) {
  if (state.busy) return;
  state.busy = true; renderPlan();
  showStatus("info", label + "...");
  try {
    var response = await request();
    var body = null;
    try { body = await response.json(); } catch (e) { body = null; }
    if (!response.ok || !body || body.status !== "success") {
      var text = failureText(body, response.status);
      showStatus("error", text[0], text[1]);
    } else {
      onOk(body);
      var warnings = body.warnings || [];
      if (warnings.length) showStatus("warn", "Saved, with a note:", warnings.join(" ")); else showStatus("info", "Saved.");
    }
  } catch (error) {
    showStatus("error", "Could not reach the PreReqAI server.", "Check that it is running and your connection, then try again.");
  } finally {
    state.busy = false; renderPlan();
  }
}

function setStudied(concept, studied) {
  act(studied ? "Saving progress" : "Undoing progress",
      function () { return fetch(sessionUrl("/studied") + encodeURIComponent(concept), { method: studied ? "POST" : "DELETE" }); },
      function (body) {
        state.studied = {}; (body.study_progress || []).forEach(function (p) { if (p.completed) state.studied[p.concept] = true; });
        state.readiness = body.readiness || state.readiness; state.studyTime = body.study_time || state.studyTime;
        renderMeta();
      });
}

function setKnown(concept, known) {
  act(known ? "Removing " + concept + " from your plan" : "Putting " + concept + " back in your plan",
      function () { return fetch(sessionUrl("/known") + encodeURIComponent(concept), { method: known ? "POST" : "DELETE" }); },
      function (body) { render({ session_id: state.sid, report: body.report, warnings: body.warnings }); });
}

async function downloadPlan() {
  if (state.busy || !state.sid) return;
  state.busy = true; renderPlan();
  showStatus("info", "Preparing the study plan...");
  try {
    var response = await fetch("/api/session/" + encodeURIComponent(state.sid) + "/plan");
    if (!response.ok) {
      var body = null;
      try { body = await response.json(); } catch (e) { body = null; }
      var text = failureText(body, response.status);
      showStatus("error", text[0], text[1]);
    } else {
      var link = el("a");
      link.href = URL.createObjectURL(new Blob([await response.text()], { type: "text/markdown" }));
      link.download = "study-plan.md";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
      showStatus("info", "Downloaded study-plan.md.");
    }
  } catch (error) {
    showStatus("error", "Could not reach the PreReqAI server.", "Check that it is running and your connection, then try again.");
  } finally {
    state.busy = false; renderPlan();
  }
}

async function restore() {
  var sid = recall();
  if (!sid) return;
  showStatus("info", "Restoring your saved session...");
  try {
    var response = await fetch("/api/session/" + encodeURIComponent(sid)), body = null;
    try { body = await response.json(); } catch (e) { body = null; }
    if (response.status === 404) {
      remember(null);
      return showStatus("info", "Your earlier session is no longer on the server, so its progress cannot be restored.", "Analyse the paper again.");
    }
    if (!response.ok || !body || !body.session_id) {
      var text = failureText(body, response.status);
      return showStatus("error", text[0], text[1]);
    }
    var hours = {};
    ((body.study_time || {}).schedule || []).forEach(function (day) {
      day.items.forEach(function (item) { hours[item.concept] = (hours[item.concept] || 0) + item.hours; });
    });
    state.sid = sid; state.paper = { title: body.paper_title }; state.difficulty = null;
    state.studyTime = body.study_time; state.readiness = body.readiness; state.known = [];
    state.studied = {}; state.links = {};
    state.steps = (body.study_progress || []).map(function (p, index) {
      if (p.completed) state.studied[p.concept] = true;
      return { step: index + 1, concept: p.concept, hours: Math.round((hours[p.concept] || 0) * 100) / 100 };
    });
    (body.next_resources || []).forEach(function (r) { state.links[r.concept] = r; });
    renderMeta();
    fill("concepts", el("p", "Restored session: analyse the paper again to see its detected concepts.", "msg info"));
    fill("gaps", el("p", "Restored session: your plan and progress are below.", "msg info"));
    renderPlan();
    $("results").hidden = false;
    showStatus("info", "Restored your saved session.");
  } catch (error) {
    showStatus("error", "Could not reach the PreReqAI server.", "Check that it is running and your connection, then reload the page.");
  }
}

function failureText(body, status) {
  var detail = body && (typeof body.detail === "string" ? body.detail : body.message);
  return [detail || ("The request failed (HTTP " + status + ")."), body && body.hint];
}

async function submit(event) {
  event.preventDefault();
  var file = $("paper").files[0], source = $("source").value.trim(), known = $("known").value;
  $("results").hidden = true;
  if (!file && !source) return showStatus("error", "Choose a PDF or enter an arXiv link or DOI.");
  if (file && source) return showStatus("error", "Use either a PDF or an arXiv link / DOI, not both.");
  var data = new FormData();
  if (file) data.append("paper", file); else data.append("source", source);
  known.split(",").map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (k) { data.append("known", k); });
  $("submit").disabled = true;
  showStatus("info", "Analysing the paper... this can take a few seconds" + (source ? " (the paper is downloaded first)." : "."));
  try {
    var response = await fetch("/api/prerequisites/analyze", { method: "POST", body: data });
    var body = null;
    try { body = await response.json(); } catch (e) { body = null; }
    if (!response.ok || !body || body.status !== "success") {
      var text = failureText(body, response.status);
      showStatus("error", text[0], text[1]);
    } else {
      render(body);
    }
  } catch (error) {
    showStatus("error", "Could not reach the PreReqAI server.", "Check that it is running and your connection, then try again.");
  } finally {
    $("submit").disabled = false;
  }
}

$("form").addEventListener("submit", submit);
$("download").addEventListener("click", downloadPlan);
restore();
</script>
</body>
</html>
