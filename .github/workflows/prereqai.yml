name: PreReqAI checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # the checks only read the repository

jobs:
  prereqai:
    # The README declares Python 3.10 or newer: run the product tests on the oldest and newest supported versions.
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the PreReqAI suite takes about 4 minutes; a hung job should not hold a runner for 6 hours
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: PreReqAI product tests (the release checks)
        run: python -m pytest -m prereqai backend/tests -q
      - name: API generation and generated-project release checks
        # the release checklist (docs/release-checklist.md, step 3) requires these as well; about 20 seconds, offline
        run: python -m pytest -q backend/tests/test_api_generation_*.py backend/tests/test_generated_project_*.py
      - name: README quickstart
        run: python -m backend.cli prerequisites analyze examples/prerequisites/sample-paper.pdf
      - name: README quickstart with only the runtime requirements
        # the steps above run in an environment that also has pytest/httpx; a user installs just requirements.txt
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/runtime/bin/python" -m backend.cli prerequisites analyze examples/prerequisites/sample-paper.pdf
      - name: CLI question answering with only the runtime requirements
        # `ask` is the other documented CLI path: it must not need the test-only packages either
        run: >-
          "$RUNNER_TEMP/runtime/bin/python" -m backend.cli prerequisites ask
          examples/prerequisites/sample-paper.pdf "What is attention?"
      - name: README HTTP server with only the runtime requirements
        # the server and its multipart upload need packages (fastapi, uvicorn, python-multipart) that the test suite's TestClient hides
        run: |
          "$RUNNER_TEMP/runtime/bin/python" -m uvicorn backend.main:app --port 8000 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          curl -sf -F "paper=@examples/prerequisites/sample-paper.pdf;type=application/pdf" \
            http://127.0.0.1:8000/api/prerequisites/analyze | grep -q '"status":"success"'
      - name: Other documented CLI commands with only the runtime requirements
        # ask, the other two command groups and the version/help screens are lazy-imported per command, so a package missing from
        # requirements.txt that only one of them needs would pass every step above (they run with the dev requirements)
        run: |
          PY="$RUNNER_TEMP/runtime/bin/python"
          "$PY" -m backend.cli --version
          "$PY" -m backend.cli --help > /dev/null
          "$PY" -m backend.cli prerequisites ask examples/prerequisites/sample-paper.pdf "What should I learn first?"
          "$PY" -m backend.cli prerequisites analyze examples/prerequisites/sample-paper.pdf --tree --resources --plan-file "$RUNNER_TEMP/plan.md"
          "$PY" -m backend.cli prerequisites analyze examples/prerequisites/sample-paper.pdf --resume "$RUNNER_TEMP/plan.md"
          "$PY" -m backend.cli api-generation generate --draft examples/api-generation/draft.json --output-dir "$RUNNER_TEMP/generated-api"
          "$PY" -m backend.cli api-generation check "$RUNNER_TEMP/generated-api"
          "$PY" -m backend.cli recovery-decision readiness
