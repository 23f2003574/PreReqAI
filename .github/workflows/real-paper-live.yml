name: PreReqAI real-paper validation

# Manual only: downloads a published paper from arXiv, so it is not part of the offline checks in prereqai.yml.
# It runs the existing release-blocker test (backend/tests/test_prereqai_real_paper_live.py); a failure is the real-paper finding.
on:
  workflow_dispatch:

permissions:
  contents: read  # no secrets are used; the test only reads the repository and the public arXiv paper

jobs:
  real-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Live-paper test (arXiv:1706.03762)
        env:
          PREREQAI_LIVE_PAPER: "1"
        run: python -m pytest backend/tests/test_prereqai_real_paper_live.py -v -rs
